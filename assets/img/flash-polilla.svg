<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141519"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="#000" filter="url(#noise)" opacity="0.15"/>
  <g fill="none" stroke="#dfc394" stroke-width="1.5" opacity="0.5">
    <path d="M300 150 Q250 200 220 300 Q250 280 300 350 Q350 280 380 300 Q350 200 300 150" fill="#dfc394" fill-opacity="0.08"/>
    <ellipse cx="300" cy="280" rx="50" ry="70" fill="#dfc394" fill-opacity="0.1"/>
    <g stroke-width="1" opacity="0.4">
      <path d="M250 280 Q220 320 250 360 Q280 340 250 280"/>
      <path d="M350 280 Q380 320 350 360 Q320 340 350 280"/>
    </g>
    <ellipse cx="280" cy="260" rx="15" ry="20" fill="#dfc394" fill-opacity="0.3"/>
    <ellipse cx="320" cy="260" rx="15" ry="20" fill="#dfc394" fill-opacity="0.3"/>
    <path d="M300 350 L300 600" stroke-width="2"/>
    <g stroke-width="1.2" opacity="0.45">
      <path d="M220 380 L180 480"/>
