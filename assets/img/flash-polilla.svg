      <circle cx="300" cy="600" r="15" fill="none"/>
    </g>
  </g>
  <text x="300" y="720" font-family="Georgia, serif" font-size="12" fill="#dfc394" text-anchor="middle" opacity="0.5">Devoción & Manto • Ornamental Sacro</text>
