<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141519"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="#000" filter="url(#noise)" opacity="0.15"/>
  <g fill="none" stroke="#dfc394" stroke-width="2" opacity="0.5">
    <ellipse cx="300" cy="320" rx="120" ry="150" fill="#dfc394" fill-opacity="0.04"/>
    <path d="M250 220 Q220 250 250 290 Q230 270 200 250" fill="#dfc394" fill-opacity="0.15"/>
    <path d="M350 220 Q380 250 350 290 Q370 270 400 250" fill="#dfc394" fill-opacity="0.15"/>
    <ellipse cx="280" cy="280" rx="35" ry="45" fill="#dfc394" fill-opacity="0.25"/>
    <ellipse cx="320" cy="280" rx="35" ry="45" fill="#dfc394" fill-opacity="0.25"/>
    <path d="M240 350 Q300 380 360 350" stroke-width="2.5"/>
    <g stroke-width="1.2" opacity="0.4">
      <path d="M250 320 L200 400"/>
      <path d="M350 320 L400 400"/>
      <path d="M200 380 L150 480"/>
      <path d="M400 380 L450 480"/>
      <path d="M180 440 L120 540"/>
      <path d="M420 440 L480 540"/>
    </g>
    <path d="M260 420 Q300 460 340 420" fill="#dfc394" fill-opacity="0.15" stroke-width="2"/>
    <circle cx="300" cy="450" r="50" fill="none" stroke-width="1.5" stroke-dasharray="5,5"/>
    <circle cx="300" cy="450" r="30" fill="none" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  <text x="300" y="720" font-family="Georgia, serif" font-size="12" fill="#dfc394" text-anchor="middle" opacity="0.5">Corona de Espinas • Dark Realism</text>
</svg>