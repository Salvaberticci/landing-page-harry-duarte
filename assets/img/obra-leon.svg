<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141519"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="#000" filter="url(#noise)" opacity="0.15"/>
  <g fill="none" stroke="#dfc394" stroke-width="1.5" opacity="0.3">
    <path d="M400 200 Q300 350 400 500 Q500 350 400 200"/>
    <path d="M350 300 Q280 400 350 500 Q420 400 350 300" stroke-width="1"/>
    <path d="M450 300 Q520 400 450 500 Q380 400 450 300" stroke-width="1"/>
    <ellipse cx="400" cy="420" rx="80" ry="60"/>
    <ellipse cx="360" cy="380" rx="15" ry="20" fill="#dfc394" fill-opacity="0.3"/>
    <ellipse cx="440" cy="380" rx="15" ry="20" fill="#dfc394" fill-opacity="0.3"/>
    <path d="M350 450 Q400 480 450 450" stroke-width="2"/>
    <g stroke-width="0.8" opacity="0.4">
      <path d="M320 320 Q280 350 320 400"/>
      <path d="M480 320 Q520 350 480 400"/>
      <path d="M280 420 Q220 450 280 520"/>
      <path d="M520 420 Q580 450 520 520"/>
    </g>
  </g>
  <text x="400" y="950" font-family="Georgia, serif" font-size="14" fill="#dfc394" text-anchor="middle" opacity="0.5">León Monárquico • Dark Realism</text>
</svg>