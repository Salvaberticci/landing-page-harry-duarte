<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141519"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="#000" filter="url(#noise)" opacity="0.15"/>
  <g fill="none" stroke="#dfc394" stroke-width="1.5" opacity="0.35">
    <rect x="100" y="100" width="600" height="400" rx="10" fill="#dfc394" fill-opacity="0.02"/>
    <rect x="150" y="150" width="500" height="300" rx="8" fill="none" stroke-width="1" opacity="0.3"/>
    <g stroke-width="1" opacity="0.4">
      <path d="M200 200 L200 400"/>
      <path d="M600 200 L600 400"/>
      <path d="M200 300 L600 300"/>
      <path d="M300 150 L300 450"/>
      <path d="M500 150 L500 450"/>
    </g>
    <ellipse cx="400" cy="300" rx="120" ry="80" fill="#dfc394" fill-opacity="0.05"/>
    <path d="M350 280 Q380 260 420 280 Q400 270 350 280" fill="#dfc394" fill-opacity="0.2"/>
    <ellipse cx="380" cy="280" rx="20" ry="25" fill="#dfc394" fill-opacity="0.3"/>
    <ellipse cx="420" cy="280" rx="20" ry="25" fill="#dfc394" fill-opacity="0.3"/>
    <path d="M360 320 Q400 350 440 320" stroke-width="2"/>
    <g stroke-width="0.8" opacity="0.3">
      <path d="M250 250 L250 200"/>
      <path d="M550 250 L550 200"/>
      <path d="M250 350 L250 400"/>
      <path d="M550 350 L550 400"/>
    </g>
  </g>
  <text x="400" y="550" font-family="Georgia, serif" font-size="14" fill="#dfc394" text-anchor="middle" opacity="0.5">Atelier Harry Duarte • Fine Line 0.25mm</text>
</svg>