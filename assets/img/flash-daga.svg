    <path d="M250 180 Q200 200 180 250 Q200 230 250 210 Q230 220 250 210" fill="#dfc394" fill-opacity="0.2"/>
    <path d="M350 180 Q400 200 420 250 Q400 230 350 210 Q370 220 350 210" fill="#dfc394" fill-opacity="0.2"/>
    <ellipse cx="300" cy="450" rx="80" ry="100" fill="#dfc394" fill-opacity="0.08"/>
    <path d="M220 450 Q200 500 220 550 Q250 530 220 450" stroke-width="2" fill="#dfc394" fill-opacity="0.15"/>
    <path d="M380 450 Q400 500 380 550 Q350 530 380 450" stroke-width="2" fill="#dfc394" fill-opacity="0.15"/>
    <g stroke-width="1.5" opacity="0.5">
