<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141519"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="#000" filter="url(#noise)" opacity="0.15"/>
  <g fill="none" stroke="#dfc394" stroke-width="2" opacity="0.55">
    <ellipse cx="300" cy="300" rx="100" ry="130" fill="#dfc394" fill-opacity="0.04"/>
    <path d="M280 220 Q250 240 280 270 Q300 250 280 220" fill="#dfc394" fill-opacity="0.2"/>
    <path d="M320 220 Q350 240 320 270 Q300 250 320 220" fill="#dfc394" fill-opacity="0.2"/>
    <path d="M230 320 Q200 350 230 380 Q260 360 230 320" fill="#dfc394" fill-opacity="0.15"/>
    <path d="M370 320 Q400 350 370 380 Q340 360 370 320" fill="#dfc394" fill-opacity="0.15"/>
    <ellipse cx="300" cy="350" rx="40" ry="30" fill="#dfc394" fill-opacity="0.2"/>
    <path d="M300 300 L300 500" stroke-width="2"/>
    <g stroke-width="1.5" opacity="0.4">
      <path d="M250 380 L200 480"/>
      <path d="M350 380 L400 480"/>
      <path d="M220 420 L150 540"/>
      <path d="M380 420 L450 540"/>
    </g>
    <path d="M260 420 Q300 460 340 420" fill="#dfc394" fill-opacity="0.15" stroke-width="2"/>
    <g stroke-width="1" opacity="0.3">
      <path d="M300 200 L300 150"/>
      <path d="M200 500 L150 580"/>
      <path d="M400 500 L450 580"/>
    </g>
  </g>
  <text x="300" y="720" font-family="Georgia, serif" font-size="12" fill="#dfc394" text-anchor="middle" opacity="0.5">Matrioskas Anatómicas • Dark Realism</text>
</svg>